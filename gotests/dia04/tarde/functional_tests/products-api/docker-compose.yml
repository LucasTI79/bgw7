networks:
  bgw7_network:
    driver: bridge
    # driver: overlay
    # attachable: true
volumes:
  portainer_data:
services:
  api:
    build: 
      context: .
      dockerfile: docker/Dockerfile-go
    restart: always
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    networks:
      - bgw7_network

  database:
    image: mysql:9.3.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./.data:/var/lib/mysql
      - ./database/db.sql:/docker-entrypoint-initdb.d/setup.sql
    ports:
      - "${DB_PORT}:3306"
    networks:
      - bgw7_network
  portainer:
    platform: linux/x86_64
    image: portainer/portainer-ce
    restart: always
    ports:
      - 9000:9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - bgw7_network